name: Daily Macro Data Update & GitHub Pages Deploy

on:
  schedule:
    # 每天 UTC 01:00 (台灣時間早上 09:00) 自動執行更新
    - cron: '0 1 * * *'
  workflow_dispatch: # 支援手動一鍵觸發

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update & Build Static Data & Gemini Diagnosis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.gemini_api_key }}
        run: |
          echo "Checking GEMINI_API_KEY secret presence..."
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is detected in environment! Length: ${#GEMINI_API_KEY}"
          else
            echo "WARNING: GEMINI_API_KEY is EMPTY. Please check GitHub Repository Secrets."
          fi
          python update_and_build.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add macro_data.db docs/data.js docs/diagnosis_result.json docs/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): auto-update macro indicators and Gemini AI diagnosis [skip ci]"
            git push origin main
          fi
